<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: one narrow study column like a 수험 단권화 노트 — tabs on top, one card at a time, controls at thumb height */
:root{

  --accent:#3d7468; --accent-ink:#f6f5ef; --accent-soft:#e6efeb; --seal:#a2493c;
  --again:#a9503f; --hard:#8a6620; --good:#3d7468; --easy:#3f6390;
  --chip:#e3e2da; --bark:#5e4a2c; --water:#4a7fb8; --leaf-young:#9cc47e; --leaf:#3f7537; --shadow:0 1px 2px rgba(42,47,56,.05),0 6px 18px rgba(42,47,56,.05);
  --f-display:"Nanum Myeongjo","Noto Serif KR","AppleMyungjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1a1d21; --sheet:#23272c; --ink:#d8dbd5; --ink-2:#9aa1ab; --rule:#343a42; --rv-bg:#2f3e3a; --rv-ink:#cfe0d8; --rv-line:#3f5550;
  --accent:#7fae9f; --accent-ink:#16201d; --accent-soft:#263632; --seal:#d28c7f;
  --again:#d28c7f; --hard:#c8a565; --good:#7fae9f; --easy:#8ea9cc; --chip:#2c3137; --bark:#8b6f4a; --water:#79a8d8; --leaf-young:#a9cf8c; --leaf:#5f9a52;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1a1d21; --sheet:#23272c; --ink:#d8dbd5; --ink-2:#9aa1ab; --rule:#343a42; --rv-bg:#2f3e3a; --rv-ink:#cfe0d8; --rv-line:#3f5550;
  --accent:#7fae9f; --accent-ink:#16201d; --accent-soft:#263632; --seal:#d28c7f;
  --again:#d28c7f; --hard:#c8a565; --good:#7fae9f; --easy:#8ea9cc; --chip:#2c3137; --bark:#8b6f4a; --water:#79a8d8; --leaf-young:#a9cf8c; --leaf:#5f9a52;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
.wrap{max-width:640px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:14px 8px;border-bottom:1px solid var(--rule)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:1.35rem;margin:0;letter-spacing:-.01em}
.sync{font-size:.75rem;color:var(--ink-2)}
nav{display:flex;gap:4px;margin-top:10px}

nav button[aria-selected="true"]{background:var(--sheet);color:var(--ink);border-color:var(--rule)}

main{padding-top:16px}

.count{display:flex;align-items:baseline;gap:5px;padding:4px 10px;border-radius:999px;background:var(--chip);font-size:.82rem;color:var(--ink-2)}

.exam{font-size:.82rem;margin-top:6px;color:var(--ink-2)}
.exam b{color:var(--seal);margin-right:4px}
.tag.exam{color:var(--seal);font-weight:600;border:1px solid color-mix(in srgb,var(--seal) 40%,transparent);background:transparent}
.exq{font-size:1.05rem;line-height:1.7;margin:4px 0 10px}
.exa{border-top:1px dashed var(--rule);padding-top:14px;line-height:1.7;font-size:.95rem}
.exa b{color:var(--accent)}
.foldbtn{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:left;flex:1;cursor:pointer}
.panel.foldable>h2{cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:8px;user-select:none}

.oxbtn .rate span{font-size:1.4rem}
.oxexp{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--paper);font-size:.92rem;line-height:1.7}

.exhome{display:grid;gap:10px}
.exbox{padding:14px;border-radius:12px;background:var(--paper)}.exbox.flat{padding:0;background:none}details.more{display:inline}details.more summary{display:inline;cursor:pointer;color:var(--accent);list-style:none}details.more summary::-webkit-details-marker{display:none}details.more[open]{display:block;margin-top:4px}
.exbox h3{margin:0 0 4px;font-size:1rem}

.oxstar{font:inherit;font-size:.78rem;border:1px solid var(--rule);background:transparent;color:var(--ink-2);border-radius:999px;padding:2px 9px;cursor:pointer}

.oxsl{list-style:none;margin:0 0 10px;padding:0;font-size:.85rem;line-height:1.55}
.oxsl li{padding:6px 0;border-bottom:1px solid var(--rule)}
.oxsl li .link{margin-left:6px;font-size:.8rem}
table.acc{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
table.acc th,table.acc td{padding:6px 4px;text-align:left;border-bottom:1px solid var(--rule)}
table.acc thead th{font-weight:500;color:var(--ink-2);font-size:.8rem}
.leechtip{margin-top:12px;font-size:.86rem;padding:8px 10px;border-radius:8px;border:1px dashed var(--again);color:var(--ink-2)}
.garden .ghead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.garden .ghead b{font-family:var(--f-display);font-size:1.5rem;color:var(--accent)}
.gweek{display:flex;justify-content:space-between;max-width:340px;margin:10px 0 2px}
.gd{display:flex;flex-direction:column;align-items:center;gap:1px}.gd small{font-size:.72rem;color:var(--ink-2)}.gd.now small{color:var(--ink);font-weight:700}
.gnote{font-size:.78rem;margin:4px 0 6px}
.gscenewrap{margin:6px -6px 0;border-radius:0 0 10px 10px;overflow:hidden}.gscene{width:100%;display:block}
.glabels{display:grid;gap:4px;text-align:center;margin-top:2px}
.glabels>div{display:flex;flex-direction:column;line-height:1.35}.glabels b{font-size:.92rem}.glabels span.muted{font-size:.78rem}.glabels small{font-size:.72rem;margin-top:2px}
.gleg{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:.74rem;color:var(--ink-2);margin-top:10px}

.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;max-width:520px}

.heatleg i{width:11px;height:11px;border-radius:3px;display:inline-block}
.heatleg i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--chip))}.heatleg i.l2{background:color-mix(in srgb,var(--accent) 55%,var(--chip))}.heatleg i.l3{background:color-mix(in srgb,var(--accent) 80%,var(--chip))}.heatleg i.l4{background:var(--accent)}
.gauge{position:relative;height:10px;border-radius:99px;background:var(--chip);margin:8px 0 4px}

.prompt{font-family:var(--f-display);font-size:clamp(1.3rem,5.4vw,1.6rem);font-weight:800;line-height:1.45;text-wrap:balance;word-break:keep-all}

.card.front{min-height:max(220px,calc(100svh - 330px))}.card.front>.meta+*{margin-top:auto}.card.front>:last-child{margin-bottom:auto}

.mean{font-size:1rem}

.ref{font-family:var(--f-mono);font-size:.8rem;color:var(--ink-2);word-break:break-all}

.actions{position:fixed;left:0;right:0;bottom:0;z-index:4;max-width:640px;margin:0 auto;display:grid;gap:8px;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to bottom,transparent,var(--paper) 14px)}
body.hasact main{padding-bottom:var(--actH,140px)}
.card.tap{cursor:pointer}
.grp{border:1px solid var(--rule);border-radius:12px;background:var(--sheet)}

<script>
(function(){
"use strict";
var CARDS_RAW=JSON.parse(document.getElementById("cards-data").textContent);
var DAY=86400000, ROLL_HOUR=4;
/* ---------- FSRS-5 (default parameters) ---------- */
var W0=[0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];
var W=W0.slice();
function applyWeights(w){W=(Array.isArray(w)&&w.length===19&&w.every(function(x){return typeof x==="number"&&isFinite(x);}))?w.slice():W0.slice();}
var DECAY=-0.5, FACTOR=19/81;
function clampD(d){return Math.min(10,Math.max(1,d));}
function retr(t,s){return Math.pow(1+FACTOR*t/s,DECAY);}
function ivlDays(s,r){return s/FACTOR*(Math.pow(r,1/DECAY)-1);}
function initD(g){return clampD(W[4]-Math.exp(W[5]*(g-1))+1);}
function nextD(d,g){var dp=d+(-W[6]*(g-3))*(10-d)/9;return clampD(W[7]*initD(4)+(1-W[7])*dp);}
function recallS(d,s,r,g){return s*(1+Math.exp(W[8])*(11-d)*Math.pow(s,-W[9])*(Math.exp(W[10]*(1-r))-1)*(g===2?W[15]:1)*(g===4?W[16]:1));}
function forgetS(d,s,r){return Math.min(s,W[11]*Math.pow(d,-W[12])*(Math.pow(s+1,W[13])-1)*Math.exp(W[14]*(1-r)));}
function shortS(s,g){return s*Math.exp(W[17]*(g-3+W[18]));}

/* ---------- cards ---------- */
var ROWS=[], CARDS=[], BYID={};
// 내 카드: state.mine[id]={id,part,q,acr,a,note,t(만든 시각),u(고친 시각),del}
function mineRows(){var m=(typeof state!=="undefined"&&state&&state.mine)||{};
  return Object.keys(m).map(function(k){return m[k];}).filter(function(x){return x&&!x.del&&x.q&&x.a;}).sort(function(a,b){return (a.t||0)-(b.t||0);})
    .map(function(x){return {id:x.id,part:x.part,acr:x.acr||"",topic:x.q,mean:x.a,note:x.note||"",ref:"",tags:["내 카드"],mine:true};});}
function buildCards(){
  ROWS=CARDS_RAW.concat(mineRows());CARDS=[];BYID={};
  ROWS.forEach(function(r,i){["g"].forEach( // (나) 두문자 → 뜻 방향은 2026-11 사용자 요청으로 없앰(예전 기록은 state에 남지만 쓰지 않음)
function(dir){var c={id:r.id+"-"+dir,row:r,dir:dir,order:(r.mine?-1000000:0)+i*2+(dir==="g"?0:1)};CARDS.push(c);BYID[c.id]=c;});});
  if(typeof current!=="undefined"&&current)current=BYID[current.id]||null;
}
buildCards();
var PARTS=[];CARDS_RAW.forEach(function(r){if(PARTS.indexOf(r.part)<0)PARTS.push(r.part);});

/* ---------- state ---------- */
var DEFAULTS={newPerDay:6,retention:0.9,dirs:{g:true,n:true},parts:{}};
var state={v:1,settings:JSON.parse(JSON.stringify(DEFAULTS)),cards:{},daily:{},hist:{},custom:{},susp:{},flag:{},updatedAt:0};
var LS_KEY="minbeop-dumunja-v1";
function now(){return Date.now();}
function dayKey(t){var d=new Date(t-ROLL_HOUR*3600000);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dayEnd(t){var d=new Date(t-ROLL_HOUR*3600000);d.setHours(0,0,0,0);return d.getTime()+DAY+ROLL_HOUR*3600000;}
function settings(){var s=state.settings;if(typeof s.retention!=="number")s.retention=DEFAULTS.retention;if(typeof s.newPerDay!=="number")s.newPerDay=DEFAULTS.newPerDay;if(!s.dirs)s.dirs={g:true,n:true};if(!s.parts)s.parts={};migrateParts(s.parts);if(!state.custom)state.custom={};if(!state.susp)state.susp={};if(!state.flag)state.flag={};applyWeights(s.w);return s;}
function partOn(p){return settings().parts[p]!==false;}
function migrateParts(ps){ // 계약·법정채권 편을 '제4편 채권각론'으로 합침
  var o1="제3편 계약",o2="제3편 법정채권";
  if(!(o1 in ps)&&!(o2 in ps))return;
  if(ps[o1]===false&&ps[o2]===false)ps["제4편 채권각론"]=false;
  delete ps[o1];delete ps[o2];
}
function cardOn(c){return partOn(c.row.part)&&!state.susp[c.row.id];}
function custom(r){return state.custom[r.id]||{};}
function dispAcr(r){return custom(r).acr||r.acr;}
function cs(id){return state.cards[id];}
/* 자주 잊는 카드
   붙음: 정식 복습(하루 이상 지난 복습)에서 「다시」가 LEECH_LAPSES번 쌓이면. 처음 외우는 단계의 「다시」는 세지 않는다.
   뗌: ① 정식 복습에서 LEECH_CLEAR번 연달아 떠올리거나 ② 정식 복습 1번 떠올린 뒤 다른 날 연습에서 한 번에 떠올리면.
       떼면 셈(lk)을 0으로 돌려, 그다음 한 번 틀렸다고 바로 다시 붙지 않는다. 연습만으로는 떼지 않는다.
   lk: 마지막으로 뗀 뒤 정식 복습에서 누른 「다시」 수. 예전 기록(lk 없음)은 lapses 로 채운다(이미 뗀 카드는 0). */
var LEECH_LAPSES=2, LEECH_CLEAR=2;
function leechCount(s){return !s?0:s.lk!=null?s.lk:((s.ok||0)>=LEECH_CLEAR?0:(s.lapses||0));}
function isLeech(id){var s=cs(id);return !!s&&s.st!=="new"&&leechCount(s)>=LEECH_LAPSES;}
function leechClear(n){n.lk=0;delete n.ok;}
function leechIds(){return CARDS.filter(function(c){return cardOn(c)&&isLeech(c.id);}).map(function(c){return c.id;});}
function todayNewCount(){var k=dayKey(now());return (state.daily[k]&&state.daily[k].n)||0;}

/* ---------- storage ---------- */
var db=null, uid=null, docRef=null, saving=false, pending=false, saveTimer=null, downloads=null;
function loadLocal(){try{var t=localStorage.getItem(LS_KEY);if(t){var o=JSON.parse(t);if(o&&o.v===1)return o;}}catch(e){}return null;}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}
function setSync(t){document.getElementById("sync").textContent=t;}
/* 두 기기 기록 합치기: 카드는 마지막으로 바뀐 쪽, 설정·내 두문자·보류·날짜별 기록은 항목마다 나중에 바뀐 쪽을 쓴다.
   항목별 변경 시각(meta)은 저장할 때 직전 모습과 비교해서 찍는다. 백업 불러오기·기록 지우기는 base 시각이 더 새로운 쪽이 통째로 이긴다. */
var snap=null;
function ensureMeta(st){st.meta=st.meta||{};["cu","su","fl","dy","hs"].forEach(function(k){if(!st.meta[k]||typeof st.meta[k]!=="object")st.meta[k]={};});return st.meta;}
function jmap(o){var m={};Object.keys(o||{}).forEach(function(k){m[k]=JSON.stringify(o[k]);});return m;}
function takeSnap(){snap={set:JSON.stringify(state.settings),cu:jmap(state.custom),su:jmap(state.susp),fl:jmap(state.flag),dy:jmap(state.daily),hs:jmap(state.hist)};}
function stampChanges(){
  if(!snap){takeSnap();return;}
  var t=now(),m=ensureMeta(state);
  if(JSON.stringify(state.settings)!==snap.set)m.set=t;
  [["cu","custom"],["su","susp"],["fl","flag"],["dy","daily"],["hs","hist"]].forEach(function(p){
    var cur=jmap(state[p[1]]),old=snap[p[0]];
    Object.keys(cur).concat(Object.keys(old)).forEach(function(k){if(cur[k]!==old[k])m[p[0]][k]=t;});
  });
  Object.keys(m.hs).forEach(function(k){if(!state.hist[k]&&Object.keys(m.hs).length>420)delete m.hs[k];});
  takeSnap();
}
function mergeStates(a,b){
  var ua=a.updatedAt||0,ub=b.updatedAt||0,A=a.base||0,B=b.base||0;
  if(A!==B){var w=JSON.parse(JSON.stringify(A>B?a:b));w.updatedAt=Math.max(ua,ub);return w;}
  var ma=ensureMeta(JSON.parse(JSON.stringify(a))),mb=ensureMeta(JSON.parse(JSON.stringify(b)));
  a=JSON.parse(JSON.stringify(a));b=JSON.parse(JSON.stringify(b));a.meta=ma;b.meta=mb;
  var out={v:1,base:A,updatedAt:Math.max(ua,ub),cards:{},daily:{},hist:{},custom:{},susp:{},flag:{},meta:{cu:{},su:{},fl:{},dy:{},hs:{}}};
  var sa=ma.set||0,sb=mb.set||0;
  out.settings=(sa>sb||(sa===sb&&ua>=ub))?a.settings:b.settings;out.meta.set=Math.max(sa,sb)||undefined;if(!out.meta.set)delete out.meta.set;
  var ids={};Object.keys(a.cards||{}).concat(Object.keys(b.cards||{})).forEach(function(k){ids[k]=1;});
  Object.keys(ids).forEach(function(k){var x=(a.cards||{})[k],y=(b.cards||{})[k];
    if(!x){out.cards[k]=y;return;}if(!y){out.cards[k]=x;return;}
    var tx=x.mt||x.last||0,ty=y.mt||y.last||0;out.cards[k]=(tx>ty||(tx===ty&&(x.reps||0)>=(y.reps||0)))?x:y;});
  [["cu","custom"],["su","susp"],["fl","flag"],["dy","daily"],["hs","hist"]].forEach(function(p){
    var f=p[1],mk=p[0],xa=a[f]||{},xb=b[f]||{},keys={};
    [xa,xb,ma[mk],mb[mk]].forEach(function(o){Object.keys(o).forEach(function(k){keys[k]=1;});});
    Object.keys(keys).forEach(function(k){
      var ta=ma[mk][k]||0,tb=mb[mk][k]||0,v;
      if(ta!==tb)v=ta>tb?xa[k]:xb[k];
      else if(f==="hist"&&xa[k]&&xb[k]){v={};["r","a","n","rr","ra","pc"].forEach(function(q){var m2=Math.max(xa[k][q]||0,xb[k][q]||0);if(m2||q==="r"||q==="a"||q==="n")v[q]=m2;});}
      else v=(k in xa)?xa[k]:xb[k];
      if(v!==undefined)out[f][k]=v;
      if(ta||tb)out.meta[mk][k]=Math.max(ta,tb);
    });
  });
  var ma2=a.mine||{},mb2=b.mine||{};Object.keys(ma2).concat(Object.keys(mb2)).forEach(function(k){var x=ma2[k],y=mb2[k];out.mine=out.mine||{};out.mine[k]=!x?y:!y?x:((x.u||0)>=(y.u||0)?x:y);});
  var ea=a.ex||{},eb=b.ex||{};Object.keys(ea).concat(Object.keys(eb)).forEach(function(k){var x=ea[k],y=eb[k];out.ex=out.ex||{};if(!x||!y){out.ex[k]=x||y;return;}var m=JSON.parse(JSON.stringify((x.last||0)>=(y.last||0)?x:y)),s=(x.ft||0)>=(y.ft||0)?x:y;if(s.ft){m.f=s.f;m.ft=s.ft;}out.ex[k]=m;});
  return out;
}
function sameState(x,y){var a=JSON.parse(JSON.stringify(x)),b=JSON.parse(JSON.stringify(y));delete a.updatedAt;delete b.updatedAt;return JSON.stringify(a)===JSON.stringify(b);}
function adopt(remote){ // 원격 기록을 합쳐 반영. 합친 결과가 원격과 다르면 true(올려야 함)
  if(!remote||remote.v!==1)return true;
  var merged=mergeStates(state,remote),changed=!sameState(merged,state);
  state=merged;settings();takeSnap();saveLocal();buildCards();
  if(changed&&!practice&&!editing&&(view==="study"||view==="stats"||view==="cards")){if(!revealed)current=null;render();}
  return !sameState(merged,remote);
}
function scheduleSave(){stampChanges();state.updatedAt=now();saveLocal();if(!docRef)return;clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);}
function flush(){
  if(!docRef)return;
  if(saving){pending=true;return;}

var LOG={}, logSaving={}, logPending={}, logTimer={};
function monthKey(t){return dayKey(t).slice(0,7);}
function logLocalKey(mk){return "minbeop-log-"+mk;}
function loadLogLocal(mk){try{var t=localStorage.getItem(logLocalKey(mk));if(t){var a=JSON.parse(t);if(Array.isArray(a))return a;}}catch(e){}return [];}
var LOGX={};
function logXKey(mk){return "minbeop-logx-"+mk;}
function loadLogX(mk){if(LOGX[mk])return LOGX[mk];var a=[];try{a=JSON.parse(localStorage.getItem(logXKey(mk))||"[]");if(!Array.isArray(a))a=[];}catch(e){a=[];}return LOGX[mk]=a;}
function logEKey(e){return e[0]+"|"+e[1]+"|"+e[2];}
function mergeLog(a,b,x){var seen={},out=[];(x||[]).forEach(function(k){seen[k]=1;});a.concat(b).forEach(function(e){var k=logEKey(e);if(!seen[k]){seen[k]=1;out.push(e);}});out.sort(function(x,y){return x[0]-y[0];});return out;}
function logRef(mk){return db&&uid?db.collection("data/users/"+uid).doc("log-"+mk):null;}
function saveLog(mk){
  try{localStorage.setItem(logLocalKey(mk),JSON.stringify(LOG[mk]));if(LOGX[mk]&&LOGX[mk].length)localStorage.setItem(logXKey(mk),JSON.stringify(LOGX[mk]));}catch(e){}
  var ref=logRef(mk);if(!ref)return;clearTimeout(logTimer[mk]);
  logTimer[mk]=setTimeout(function go(){if(logSaving[mk]){logPending[mk]=true;return;}logSaving[mk]=true;
    ref.set({v:1,e:LOG[mk],x:loadLogX(mk)}).catch(function(){}).then(function(){logSaving[mk]=false;if(logPending[mk]){logPending[mk]=false;go();}});},900);
}
function logAdd(id,g){var t=now(),mk=monthKey(t);LOG[mk]=LOG[mk]||loadLogLocal(mk);LOG[mk].push([Math.floor(t/1000),id,g]);saveLog(mk);}
function logUndo(id){var mk=monthKey(now()),a=LOG[mk]||(LOG[mk]=loadLogLocal(mk));for(var i=a.length-1;i>=0;i--){if(a[i][1]===id){var x=loadLogX(mk);x.push(logEKey(a[i]));if(x.length>500)x.splice(0,x.length-500);a.splice(i,1);break;}}saveLog(mk);}
function syncLogMonth(mk){var ref=logRef(mk);LOG[mk]=LOG[mk]||loadLogLocal(mk);if(!ref)return;
  ref.get().then(function(s){var dd=s.exists&&s.data()||{},r=Array.isArray(dd.e)?dd.e:[],rx=Array.isArray(dd.x)?dd.x:[],x=loadLogX(mk),xn=x.length;
    rx.forEach(function(k){if(x.indexOf(k)<0)x.push(k);});var before=LOG[mk].length;LOG[mk]=mergeLog(LOG[mk],r,x);
    if(LOG[mk].length!==r.length||before!==LOG[mk].length||x.length!==rx.length||x.length!==xn)saveLog(mk);else{try{localStorage.setItem(logLocalKey(mk),JSON.stringify(LOG[mk]));}catch(e){}}}).catch(function(){});}
function allLogs(){
  var ref=db&&uid?db.collection("data/users/"+uid):null;
  var local={};try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf("minbeop-log-")===0)local[k.slice(12)]=JSON.parse(localStorage.getItem(k))||[];}}catch(e){}
  if(!ref)return Promise.resolve(local);

}

/* ---------- scheduling ---------- */
function fuzz(days){if(days<3)return days;var f=Math.max(1,Math.round(days*0.05));return days+Math.round((Math.random()*2-1)*f);}
/* 부하 분산 + 쉬는 요일: 간격이 3일 이상이면 ±5%(최소 ±1일) 범위 안에서 복습이 가장 적은 날로 옮긴다.
   쉬는 요일로 고른 날은 범위 안에 다른 날이 있으면 피한다(Anki의 load balancing·easy days와 같은 방식). */
function balanceDue(n,id){
  if(n.st!=="review"||!n.ivl||n.ivl<3)return n;
  var t=now(),base=dayEnd(t)-DAY,ivl=n.ivl,f=Math.max(1,Math.round(ivl*0.05)),easy=settings().easyDays||[],load={};
  CARDS.forEach(function(c){if(c.id===id)return;var x=cs(c.id);if(x&&x.st==="review"&&cardOn(c)){var k=dayKey(x.due);load[k]=(load[k]||0)+1;}});
  var cand=[];for(var d=Math.max(2,ivl-f);d<=ivl+f;d++){var due=base+d*DAY;cand.push({d:d,due:due,n:load[dayKey(due)]||0,e:easy.indexOf(new Date(due).getDay())>=0});}
  var ok=cand.filter(function(c){return !c.e;});if(ok.length)cand=ok;
  var min=Math.min.apply(null,cand.map(function(c){return c.n;})),best=cand.filter(function(c){return c.n===min;});
  var pickd=best[Math.floor(Math.random()*best.length)];n.ivl=pickd.d;n.due=pickd.due;return n;
}
function preview(id,g){ // returns new card state for rating g
  var c=cs(id), t=now(), ret=settings().retention, n;
  if(!c){c={st:"new"};}
  n={reps:(c.reps||0)+1,lapses:c.lapses||0,last:t};
  var mins=function(m){return t+m*60000;};
  var daysTo=function(s){var d=Math.max(1,Math.min(36500,Math.round(ivlDays(s,ret))));return {d:d,due:dayEnd(t)-DAY+d*DAY};};
  if(c.st==="new"){
    n.s=W[g-1];n.d=initD(g);
    if(g===1){n.st="learn";n.due=mins(1);}
    else if(g===2){n.st="learn";n.due=mins(6);}
    else{var x=daysTo(n.s);n.st="review";n.due=x.due;n.ivl=x.d;}
  }else if(c.st==="learn"||c.st==="relearn"){
    n.s=shortS(c.s,g);n.d=nextD(c.d,g);
    if(g===1){n.st=c.st;n.due=mins(1);}
    else if(g===2){n.st=c.st;n.due=mins(6);}
    else{var y=daysTo(n.s);n.st="review";n.due=y.due;n.ivl=y.d;}
  }else{
    var el=Math.max(0,(t-c.last)/DAY), r=retr(el,c.s);
    n.d=nextD(c.d,g);
    if(g===1){n.s=forgetS(c.d,c.s,r);n.lapses++;n.st="relearn";n.due=mins(5);}
    else{
      if(el<1){n.s=shortS(c.s,g);}else{n.s=recallS(c.d,c.s,r,g);}
      var z=daysTo(n.s);n.st="review";n.ivl=z.d;n.due=z.due;
    }
  }
  return n;
}
function fmtIvl(n){var t=now();var ms=n.due-t;if(n.st!=="review"){var m=Math.max(1,Math.round(ms/60000));return m+"분";}var d=n.ivl||Math.round(ms/DAY);if(d<30)return d+"일";if(d<365)return (d/30).toFixed(d<60?1:0)+"개월";return (d/365).toFixed(1)+"년";}

/* ---------- session queue ---------- */
var session={buried:{},introduced:{}};
function resetSession(){session={buried:{},introduced:{}};current=null;revealed=false;}
function siblingId(id){return id.slice(0,-1)+(id.slice(-1)==="g"?"n":"g");}
function touchedToday(id){var c=cs(id);return c&&c.last&&dayKey(c.last)===dayKey(now());}
function queue(){
  var t=now(), end=dayEnd(t), learn=[], rev=[], fresh=[];
  CARDS.forEach(function(c){
    if(!cardOn(c))return;var s=cs(c.id);
    if(!s||s.st==="new"){fresh.push(c);return;}
    if(s.st==="learn"||s.st==="relearn"){learn.push(c);return;}
    if(s.due<end)rev.push(c);
  });
  var left=Math.max(0,settings().newPerDay-todayNewCount());
  var news=[];
  fresh.sort(function(a,b){return a.order-b.order;});
  for(var i=0;i<fresh.length&&news.length<left;i++){
    var c=fresh[i], sib=siblingId(c.id);
    if(touchedToday(sib))continue;
    if(news.some(function(x){return x.id===sib;}))continue;
    news.push(c);
  }
  learn.sort(function(a,b){return cs(a.id).due-cs(b.id).due;});
  return {learn:learn,rev:rev,news:news,learnNow:learn.filter(function(c){return cs(c.id).due<=t;}),learnSoon:learn.filter(function(c){return cs(c.id).due<=t+20*60000;})};
}

function seeded(id){var h=0;for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))|0;var d=dayKey(now());for(i=0;i<d.length;i++)h=(h*31+d.charCodeAt(i))|0;return h;}
function pick(){
  var q=queue();
  if(q.learnNow.length){var l=q.learnNow.filter(function(c){return !lastShown||c.id!==lastShown;});return l[0]||q.learnNow[0];}
  // interleave: shuffled reviews with new cards spaced in
  var rev=q.rev.slice().sort(function(a,b){return seeded(a.id)-seeded(b.id);});
  if(rev.length&&q.news.length){var reviewed=Object.keys(state.cards).filter(function(id){return touchedToday(id);}).length;return (reviewed%4===3)?q.news[0]:rev[0];}
  if(rev.length)return rev[0];
  if(q.news.length)return q.news[0];
  if(q.learnSoon.length)return q.learnSoon[0];
  return null;
}

/* ---------- 단원별 연습: 고른 단원은 계정에 저장돼 다음에도 그대로 ---------- */
var unitOpenPart=null;
function unitIndex(){ // 편 → 단원 목록(카드 순서) + 단원별 문제 수
  var parts=[],pm={};
  ROWS.forEach(function(r){if(r.mine||!r.unit)return;if(!pm[r.part]){pm[r.part]={part:r.part,units:[],um:{}};parts.push(pm[r.part]);}
    var P=pm[r.part];if(!P.um[r.unit]){P.um[r.unit]={key:r.part+"|"+r.unit,name:r.unit,n:0,w:0,seen:0};P.units.push(P.um[r.unit]);}});
  var S=exState(),kf="all";
  EX.forEach(function(x){if(x.kind==="toc"||!exKindOk(x,kf))return;exUnitsOf(x).forEach(function(k){var i=k.indexOf("|"),P=pm[k.slice(0,i)];if(!P)return;var u=P.um[k.slice(i+1)];if(!u)return;u.n++;var st=S[x.id];if(st&&st.n)u.seen++;if(exWrong(x,st))u.w++;});});
  return parts;
}
function unitPanel(){
